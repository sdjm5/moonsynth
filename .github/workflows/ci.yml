name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup MoonBit
        uses: moonbit-community/setup-moonbit@main
      - name: Check
        run: moon check
      - name: Test (DSP library)
        run: moon test
      - name: Build wasm kernel
        run: moon build --target wasm --release
      - name: Kernel end-to-end tests
        run: |
          cp _build/wasm/release/build/src/kernel/kernel.wasm web/synth.wasm
          node web/test-kernel.mjs
      - name: Offline renderer spectra
        run: node examples/test-render.mjs
